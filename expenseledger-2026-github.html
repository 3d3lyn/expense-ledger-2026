<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ExpenseLedger 2026</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap');

:root{
  --bg:#FFF7FB;
  --paper:#FFFFFF;
  --line:#F3D9E8;
  --ink:#5B4B6B;
  --muted:#A796B8;
  --pink:#FFB3C6;
  --pink-deep:#FF8FA8;
  --peach:#FFD3B0;
  --yellow:#FFEBA3;
  --mint:#AEEBDD;
  --lavender:#D3C2F2;
  --blue:#B9DBF9;
  --rose:#F6A6C1;
  --gray:#CBB9D8;
  --font-display:'Baloo 2', cursive;
  --font-body:'Nunito', sans-serif;
}
*{box-sizing:border-box;}
body{
  margin:0; color:var(--ink); font-family:var(--font-body); padding:24px 18px 60px;
  background-color:var(--bg);
  background-image:
    radial-gradient(var(--pink) 3.5px, transparent 3.5px),
    radial-gradient(var(--mint) 3px, transparent 3px);
  background-size: 46px 46px, 46px 46px;
  background-position: 0 0, 23px 23px;
}
h1,h2,h3{font-family:var(--font-display); margin:0;}
.wrap{max-width:1000px; margin:0 auto;}

.eyebrow{font-family:var(--font-display); font-weight:700; font-size:12px; letter-spacing:.04em; text-transform:uppercase; color:var(--pink-deep); margin-bottom:6px;}
.header{margin-bottom:22px; text-align:center;}
.header h1{font-size:34px; font-weight:800; color:var(--ink);}
.header p{color:var(--muted); font-size:14px; margin:8px 0 0;}

.stats-row{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:14px; margin-bottom:24px;}
.stat{background:var(--paper); border:2px solid var(--line); border-radius:20px; padding:14px 16px; box-shadow:0 3px 0 var(--line);}
.stat .label{font-family:var(--font-body); font-weight:700; font-size:10px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted);}
.stat .value{font-family:var(--font-display); font-size:22px; font-weight:700; margin-top:4px; color:var(--ink); font-variant-numeric:tabular-nums;}

.panel{background:var(--paper); border:2px solid var(--line); border-radius:24px; padding:22px; margin-bottom:22px; box-shadow:0 4px 0 var(--line);}
.panel h2{font-size:16px; font-weight:700; color:var(--pink-deep); margin-bottom:14px; font-family:var(--font-display);}

.entry-form{display:grid; grid-template-columns:140px 110px 160px 1fr auto; gap:10px; align-items:end;}
.field{display:flex; flex-direction:column; gap:4px;}
.field label{font-size:11px; color:var(--muted); font-weight:700; text-transform:uppercase; letter-spacing:.03em;}
input, select{
  font-family:var(--font-body); font-weight:600; font-size:14px; padding:9px 12px;
  border:2px solid var(--line); border-radius:14px; background:#FFFBFD; color:var(--ink);
}
input:focus, select:focus{outline:none; border-color:var(--pink-deep);}
button.add-btn{
  font-family:var(--font-display); font-weight:700; font-size:14px; color:#fff;
  background:var(--pink-deep); border:none; border-radius:14px; padding:10px 20px; cursor:pointer;
  box-shadow:0 3px 0 #E06E8C;
}
button.add-btn:hover{background:#ff7fa0;}
button.add-btn:active{transform:translateY(2px); box-shadow:0 1px 0 #E06E8C;}

.entry-list{margin-top:16px; display:flex; flex-direction:column; gap:8px;}
.entry-row{display:flex; align-items:center; gap:12px; padding:10px 14px; border:2px solid var(--line); border-radius:16px; background:#FFFBFD;}
.entry-row .cat-dot{width:12px; height:12px; border-radius:50%; flex-shrink:0;}
.entry-row .cat{font-size:13px; font-weight:700; min-width:100px;}
.entry-row .note{font-size:13px; color:var(--muted); flex:1;}
.entry-row .amt{font-family:var(--font-display); font-weight:700; font-size:14px; font-variant-numeric:tabular-nums;}
.entry-row .del{background:none; border:none; color:var(--gray); cursor:pointer; font-size:17px; line-height:1; padding:2px 6px;}
.entry-row .del:hover{color:var(--pink-deep);}
.empty-note{color:var(--muted); font-size:13px; font-style:italic; padding:6px 2px;}

/* categories manager */
.cat-manager{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:8px;}
.cat-chip{
  display:flex; align-items:center; gap:6px; font-size:12px; font-weight:700;
  padding:6px 10px 6px 8px; border-radius:20px; border:2px solid var(--line); background:#FFFBFD;
}
.cat-chip .dot{width:9px; height:9px; border-radius:50%;}
.cat-chip .x{cursor:pointer; color:var(--muted); font-size:13px; margin-left:2px;}
.cat-chip .x:hover{color:var(--pink-deep);}
.add-cat-form{display:flex; gap:6px; align-items:center; margin-top:6px;}
.add-cat-form input{padding:6px 10px; font-size:12px; border-radius:12px;}
.add-cat-form button{
  font-family:var(--font-body); font-weight:700; font-size:12px; color:var(--pink-deep);
  background:#FFE3ED; border:2px solid var(--line); border-radius:12px; padding:6px 12px; cursor:pointer;
}

.month-tabs{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:18px;}
.month-tab{
  font-family:var(--font-display); font-weight:700; font-size:13px; padding:8px 18px;
  border-radius:20px; border:2px solid var(--line); background:var(--paper); color:var(--ink); cursor:pointer;
}
.month-tab.active{background:var(--pink-deep); color:#fff; border-color:var(--pink-deep);}

.report-grid{display:grid; grid-template-columns:1.1fr 1fr; gap:20px;}
@media (max-width:760px){ .report-grid{grid-template-columns:1fr;} .entry-form{grid-template-columns:1fr 1fr;} }

.section-label{font-family:var(--font-body); font-weight:700; font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin-bottom:10px;}

.cat-bars{display:flex; flex-direction:column; gap:10px;}
.cat-bar-row{display:flex; align-items:center; gap:10px;}
.cat-bar-row .name{font-size:12px; font-weight:700; width:100px; flex-shrink:0; color:var(--ink);}
.cat-bar-track{flex:1; height:12px; background:var(--line); border-radius:8px; overflow:hidden;}
.cat-bar-fill{height:100%; border-radius:8px;}
.cat-bar-row .amt{font-family:var(--font-display); font-weight:700; font-size:12px; width:70px; text-align:right; flex-shrink:0;}

.heatmap{display:grid; grid-template-columns:repeat(7,1fr); gap:5px;}
.heat-cell{aspect-ratio:1; border-radius:10px; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:10px; color:var(--ink); border:2px solid var(--line);}
.heat-cell.empty{visibility:hidden; border:none;}
.heat-dow{font-weight:700; font-size:9px; color:var(--muted); text-align:center; text-transform:uppercase;}

.loading{color:var(--muted); font-weight:700; font-size:13px; padding:40px 0; text-align:center;}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div class="eyebrow">✿ Personal Ledger ✿ Jul – Dec 2026</div>
    <h1>Expense Ledger 🎀</h1>
    <p>Log expenses daily, review spending by month. Saved automatically — come back anytime.</p>
  </div>

  <div id="app"><div class="loading">Loading your ledger… 🌸</div></div>
  <div style="text-align:center; margin-top:30px; font-size:12px; color:var(--muted); font-weight:600;">created by edntsh</div>
</div>

<script>
const START_DATE = '2026-07-01';
const END_DATE = '2026-12-31';
const MONTHS = [
  {n:7, label:'July', key:'2026-07'},
  {n:8, label:'August', key:'2026-08'},
  {n:9, label:'September', key:'2026-09'},
  {n:10, label:'October', key:'2026-10'},
  {n:11, label:'November', key:'2026-11'},
  {n:12, label:'December', key:'2026-12'},
];
const DEFAULT_CATEGORIES = [
  {name:'Food', color:'var(--peach)', custom:false},
  {name:'Transport', color:'var(--mint)', custom:false},
  {name:'Housing', color:'var(--blue)', custom:false},
  {name:'Utilities', color:'var(--yellow)', custom:false},
  {name:'Entertainment', color:'var(--lavender)', custom:false},
  {name:'Shopping', color:'var(--pink)', custom:false},
  {name:'Health', color:'var(--rose)', custom:false},
  {name:'Other', color:'var(--gray)', custom:false},
];
const PALETTE_POOL = ['var(--peach)','var(--mint)','var(--blue)','var(--yellow)','var(--lavender)','var(--pink)','var(--rose)','var(--gray)'];

let data = {};
let categories = [];
let selectedDate = START_DATE;
let activeMonth = MONTHS[0].key;

function todayInRange(){
  const t = new Date();
  const iso = t.toISOString().slice(0,10);
  if (iso >= START_DATE && iso <= END_DATE) return iso;
  return START_DATE;
}

async function loadData(){
  try{
    const raw = localStorage.getItem('expenses-data');
    data = raw ? JSON.parse(raw) : {};
  }catch(e){ data = {}; }
}
async function saveData(){
  try{ localStorage.setItem('expenses-data', JSON.stringify(data)); }
  catch(e){ console.error('Save failed', e); }
}
async function loadCategories(){
  try{
    const raw = localStorage.getItem('expense-categories');
    categories = raw ? JSON.parse(raw) : DEFAULT_CATEGORIES;
  }catch(e){ categories = DEFAULT_CATEGORIES; }
}
async function saveCategories(){
  try{ localStorage.setItem('expense-categories', JSON.stringify(categories)); }
  catch(e){ console.error('Save failed', e); }
}

function addExpense(dateStr, amount, category, note){
  if (!data[dateStr]) data[dateStr] = [];
  data[dateStr].push({id: Date.now()+'-'+Math.random().toString(36).slice(2,7), amount, category, note});
}
function deleteExpense(dateStr, id){
  if (!data[dateStr]) return;
  data[dateStr] = data[dateStr].filter(e=>e.id!==id);
  if (data[dateStr].length===0) delete data[dateStr];
}
function allEntriesFlat(){
  return Object.entries(data).flatMap(([date, list]) => list.map(e=>({...e,date})));
}
function periodTotal(){ return allEntriesFlat().reduce((s,e)=>s+e.amount,0); }
function daysLogged(){ return Object.keys(data).length; }
function monthEntries(monthKey){
  return Object.entries(data).filter(([date]) => date.startsWith(monthKey)).flatMap(([date, list]) => list.map(e=>({...e,date})));
}
function monthTotal(monthKey){ return monthEntries(monthKey).reduce((s,e)=>s+e.amount,0); }
function categoryColor(name){
  const c = categories.find(c=>c.name===name);
  return c ? c.color : 'var(--gray)';
}
function fmt(n){ return n.toLocaleString(undefined,{minimumFractionDigits:2, maximumFractionDigits:2}); }
const MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];
function formatDateMY(dateStr){
  const [y,m,d] = dateStr.split('-').map(Number);
  const pad = (n) => String(n).padStart(2,'0');
  return `${pad(d)}/${pad(m)}/${y}`;
}
function daysInMonth(year, month){ return new Date(year, month, 0).getDate(); }

function render(){
  const app = document.getElementById('app');

  const total = periodTotal();
  const logged = daysLogged();
  const currentMonthTotal = monthTotal(activeMonth);
  const avgPerLoggedDay = logged > 0 ? total/logged : 0;
  const entriesForSelected = data[selectedDate] || [];

  const mEntries = monthEntries(activeMonth);
  const byCat = {};
  mEntries.forEach(e=>{ byCat[e.category] = (byCat[e.category]||0) + e.amount; });
  const maxCat = Math.max(1, ...Object.values(byCat));

  const [y,m] = activeMonth.split('-').map(Number);
  const numDays = daysInMonth(y,m);
  const firstDow = new Date(y, m-1, 1).getDay();
  const byDay = {};
  mEntries.forEach(e=>{ const d = parseInt(e.date.slice(8,10)); byDay[d] = (byDay[d]||0) + e.amount; });
  const maxDay = Math.max(1, ...Object.values(byDay));

  app.innerHTML = `
    <div class="stats-row">
      <div class="stat"><div class="label">Total spent 🌷</div><div class="value">RM ${fmt(total)}</div></div>
      <div class="stat"><div class="label">Days logged</div><div class="value">${logged}</div></div>
      <div class="stat"><div class="label">Avg / logged day</div><div class="value">RM ${fmt(avgPerLoggedDay)}</div></div>
      <div class="stat"><div class="label">${MONTHS.find(mo=>mo.key===activeMonth).label} total</div><div class="value">RM ${fmt(currentMonthTotal)}</div></div>
    </div>

    <div class="panel">
      <h2>💸 Add an expense</h2>
      <div class="cat-manager" id="catManager">
        ${categories.map(c=>`
          <span class="cat-chip">
            <span class="dot" style="background:${c.color}"></span>${c.name}
            ${c.custom ? `<span class="x" data-cat="${c.name}" title="Remove category">✕</span>` : ''}
          </span>
        `).join('')}
      </div>
      <div class="add-cat-form">
        <input type="text" id="newCatInput" placeholder="Add a category…" maxlength="20">
        <button id="addCatBtn">+ Add</button>
      </div>

      <div class="entry-form" style="margin-top:16px;">
        <div class="field"><label>Date</label><input type="date" id="dateInput" min="${START_DATE}" max="${END_DATE}" value="${selectedDate}"></div>
        <div class="field"><label>Amount</label><input type="number" id="amountInput" placeholder="0.00" step="0.01" min="0"></div>
        <div class="field"><label>Category</label>
          <select id="categoryInput">
            ${categories.map(c=>`<option value="${c.name}">${c.name}</option>`).join('')}
          </select>
        </div>
        <div class="field"><label>Note (optional)</label><input type="text" id="noteInput" placeholder="What was it for?"></div>
        <button class="add-btn" id="addBtn">Add ✿</button>
      </div>

      <div class="entry-list" id="entryList">
        ${entriesForSelected.length===0
          ? `<div class="empty-note">No expenses logged for ${formatDateMY(selectedDate)} yet 🌙</div>`
          : entriesForSelected.map(e=>`
            <div class="entry-row">
              <span class="cat-dot" style="background:${categoryColor(e.category)}"></span>
              <span class="cat">${e.category}</span>
              <span class="note">${e.note ? e.note : ''}</span>
              <span class="amt">RM ${fmt(e.amount)}</span>
              <button class="del" data-id="${e.id}" title="Delete">✕</button>
            </div>
          `).join('')
        }
      </div>
    </div>

    <div class="panel">
      <h2>📊 Monthly report</h2>
      <div class="month-tabs">
        ${MONTHS.map(mo=>`<button class="month-tab ${mo.key===activeMonth?'active':''}" data-month="${mo.key}">${mo.label}</button>`).join('')}
      </div>

      <div class="report-grid">
        <div>
          <div class="section-label">By category</div>
          <div class="cat-bars">
            ${Object.keys(byCat).length===0
              ? `<div class="empty-note">No expenses logged for ${MONTHS.find(mo=>mo.key===activeMonth).label} yet 🌙</div>`
              : Object.entries(byCat).sort((a,b)=>b[1]-a[1]).map(([cat,amt])=>`
                <div class="cat-bar-row">
                  <span class="name">${cat}</span>
                  <div class="cat-bar-track"><div class="cat-bar-fill" style="width:${(amt/maxCat*100).toFixed(0)}%; background:${categoryColor(cat)}"></div></div>
                  <span class="amt">RM ${fmt(amt)}</span>
                </div>
              `).join('')
            }
          </div>
        </div>
        <div>
          <div class="section-label">Daily spend</div>
          <div class="heatmap">
            ${['S','M','T','W','T','F','S'].map(d=>`<div class="heat-dow">${d}</div>`).join('')}
            ${Array.from({length:firstDow}).map(()=>`<div class="heat-cell empty"></div>`).join('')}
            ${Array.from({length:numDays}).map((_,i)=>{
              const day = i+1;
              const amt = byDay[day] || 0;
              const intensity = amt/maxDay;
              const bg = amt===0 ? '#FFFBFD' : `rgba(255,143,168,${0.18 + intensity*0.62})`;
              const cellDateStr = `${activeMonth}-${String(day).padStart(2,'0')}`;
              return `<div class="heat-cell" style="background:${bg}" title="${formatDateMY(cellDateStr)}: RM ${fmt(amt)}">${day}</div>`;
            }).join('')}
          </div>
        </div>
      </div>
    </div>
  `;

  document.getElementById('dateInput').addEventListener('change', (e)=>{
    selectedDate = e.target.value;
    render();
  });
  document.getElementById('addBtn').addEventListener('click', async ()=>{
    const dateVal = document.getElementById('dateInput').value;
    const amtVal = parseFloat(document.getElementById('amountInput').value);
    const catVal = document.getElementById('categoryInput').value;
    const noteVal = document.getElementById('noteInput').value.trim();
    if (!dateVal || isNaN(amtVal) || amtVal <= 0){
      alert('Enter a valid date and amount, cutie 🌷');
      return;
    }
    addExpense(dateVal, amtVal, catVal, noteVal);
    selectedDate = dateVal;
    activeMonth = dateVal.slice(0,7);
    await saveData();
    render();
  });
  document.querySelectorAll('.del').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      deleteExpense(selectedDate, btn.dataset.id);
      await saveData();
      render();
    });
  });
  document.querySelectorAll('.month-tab').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      activeMonth = btn.dataset.month;
      render();
    });
  });
  document.getElementById('addCatBtn').addEventListener('click', async ()=>{
    const input = document.getElementById('newCatInput');
    const name = input.value.trim();
    if (!name) return;
    if (categories.some(c=>c.name.toLowerCase()===name.toLowerCase())){
      alert('That category already exists!');
      return;
    }
    const color = PALETTE_POOL[categories.length % PALETTE_POOL.length];
    categories.push({name, color, custom:true});
    await saveCategories();
    render();
  });
  document.querySelectorAll('#catManager .x').forEach(x=>{
    x.addEventListener('click', async ()=>{
      const name = x.dataset.cat;
      categories = categories.filter(c=>c.name!==name);
      await saveCategories();
      render();
    });
  });
}

async function init(){
  selectedDate = todayInRange();
  activeMonth = selectedDate.slice(0,7);
  await loadData();
  await loadCategories();
  render();
}

init();
</script>
</body>
</html>
